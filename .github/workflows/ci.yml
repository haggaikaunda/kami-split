name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository validation and change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify_web: ${{ steps.changes.outputs.verify_web }}
      verify_api: ${{ steps.changes.outputs.verify_api }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify actual event commits
        id: changes
        run: node scripts/ci/changes.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: node --test scripts/ci/*.test.mjs
      - run: node --test scripts/agents/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Validate repository skills and resources
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m venv .tools/skills-validator
          .tools/skills-validator/bin/python -m pip install -r scripts/agents/requirements.txt
          .tools/skills-validator/bin/python scripts/agents/check_skills.py
          .tools/skills-validator/bin/python -m unittest discover -s scripts/agents -p '*_test.py'
  web:
    name: Web
    needs: repository
    if: ${{ !cancelled() && (needs.repository.result != 'success' || needs.repository.outputs.verify_web != 'false') }}
    uses: ./.github/workflows/web.yml
  api:
    name: API
    needs: repository
    if: ${{ !cancelled() && (needs.repository.result != 'success' || needs.repository.outputs.verify_api != 'false') }}
    uses: ./.github/workflows/api.yml
  verify:
    name: Verify
    needs: [repository, web, api]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require successful applicable checks
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          WEB_REQUIRED: ${{ needs.repository.outputs.verify_web }}
          API_REQUIRED: ${{ needs.repository.outputs.verify_api }}
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
        run: node scripts/ci/verify.mjs
