name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web
    uses: ./.github/workflows/web.yml
  api:
    name: API
    uses: ./.github/workflows/api.yml
  verify:
    name: Verify
    needs: [web, api]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful web and API checks
        env:
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          echo "Web: $WEB_RESULT; API: $API_RESULT"
          test "$WEB_RESULT" = success && test "$API_RESULT" = success
  deploy:
    name: Production deployment
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
