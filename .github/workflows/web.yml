name: Web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Web checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --init --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify prebuilt browser environment
        run: node scripts/browser/ci-environment.mjs
      - run: pnpm relay:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node --test scripts/vercel-promote.test.mjs
      - run: pnpm test
      - run: node --test scripts/browser/*.test.mjs
      - run: pnpm build
      - run: pnpm test:browser
        env:
          BROWSER_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: test-results/browser/
          retention-days: 7
