name: Web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm relay:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node --test scripts/vercel-promote.test.mjs
      - run: pnpm test
      - run: pnpm build
