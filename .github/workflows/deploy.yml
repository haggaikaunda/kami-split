name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false
  queue: max

jobs:
  api:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    uses: ./.github/workflows/api-deploy.yml
    with:
      mode: release
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  web:
    name: Deploy web
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      API_ORIGIN: ${{ needs.api.outputs.service_url }}
      CONFIGURED_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      PRODUCTION_WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate web deployment selection
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          required=(
            API_ORIGIN PRODUCTION_WEB_ORIGIN SUPABASE_PROJECT_REF
            SUPABASE_PUBLISHABLE_KEY VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN
            VERCEL_AUTOMATION_BYPASS_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production setting: $name" >&2
              exit 1
            fi
          done
          [[ "$API_ORIGIN" == https://* ]]
          [[ "$API_ORIGIN" != */ ]]
          [[ "$PRODUCTION_WEB_ORIGIN" == "https://finances.mckardah.com" ]]
          [[ "$SUPABASE_PROJECT_REF" == "zlxpapkxacnwnmgagbth" ]]
          if [[ -n "$CONFIGURED_API_ORIGIN" && "$CONFIGURED_API_ORIGIN" != "$API_ORIGIN" ]]; then
            echo "PRODUCTION_API_ORIGIN does not match the deployed Cloud Run service URL" >&2
            exit 1
          fi

      - name: Deploy web to Vercel
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          supabase_origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          deployment_url="$(pnpm dlx vercel@59.19.1 deploy \
            --prod \
            --skip-domain \
            --yes \
            --archive=tgz \
            --token "$VERCEL_TOKEN" \
            --env "ONBOARDING_ORIGIN=${PRODUCTION_WEB_ORIGIN}" \
            --env "ONBOARDING_API_URL=${API_ORIGIN}" \
            --env "ONBOARDING_PUBLIC_SUPABASE_URL=${supabase_origin}" \
            --env "ONBOARDING_PUBLIC_SUPABASE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --build-env "ONBOARDING_ORIGIN=${PRODUCTION_WEB_ORIGIN}" \
            --build-env "ONBOARDING_API_URL=${API_ORIGIN}" \
            --build-env "ONBOARDING_PUBLIC_SUPABASE_URL=${supabase_origin}" \
            --build-env "ONBOARDING_PUBLIC_SUPABASE_KEY=${SUPABASE_PUBLISHABLE_KEY}")"
          [[ "$deployment_url" == https://* ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged web deployment
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail
          supabase_origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${DEPLOYMENT_URL}/" > /dev/null
          config="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${DEPLOYMENT_URL}/api/onboarding-config")"
          jq --exit-status \
            --arg url "$supabase_origin" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '.url == $url and .key == $key' <<< "$config" > /dev/null
          health="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --header "Origin: ${PRODUCTION_WEB_ORIGIN}" \
            --header 'Content-Type: application/json' \
            --data '{"query":"{ health { status } }"}' \
            "${DEPLOYMENT_URL}/api/graphql")"
          jq --exit-status '.data.health.status == "ok"' <<< "$health" > /dev/null

      - name: Promote verified web deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/vercel-promote.mjs

      - name: Verify hosted application
        shell: bash
        run: |
          set -euo pipefail
          supabase_origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 "${PRODUCTION_WEB_ORIGIN}/" > /dev/null
          config="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 "${PRODUCTION_WEB_ORIGIN}/api/onboarding-config")"
          jq --exit-status \
            --arg url "$supabase_origin" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '.url == $url and .key == $key' <<< "$config" > /dev/null
          health="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "Origin: ${PRODUCTION_WEB_ORIGIN}" \
            --header 'Content-Type: application/json' \
            --data '{"query":"{ health { status } }"}' \
            "${PRODUCTION_WEB_ORIGIN}/api/graphql")"
          jq --exit-status '.data.health.status == "ok"' <<< "$health" > /dev/null
