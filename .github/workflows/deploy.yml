name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Classify production release
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      deploy_api: ${{ steps.changes.outputs.deploy_api }}
      deploy_web: ${{ steps.changes.outputs.deploy_web }}
    steps:
      # Never execute classification from a candidate or an uploaded CI artifact.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select cumulative changes and publish exact-commit pending status
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.mjs plan

  api:
    needs: plan
    if: ${{ needs.plan.outputs.deploy_api == 'true' }}
    uses: ./.github/workflows/api-deploy.yml
    with:
      mode: release
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  web-prepare:
    name: Prepare production web candidate
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    outputs:
      url: ${{ steps.deployment.outputs.url }}
      api_origin: ${{ vars.PRODUCTION_API_ORIGIN }}
      sha: ${{ github.event.workflow_run.head_sha }}
    env:
      API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCTION_WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate web deployment selection
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/deployment/web-selection.mjs prepare

      - name: Deploy web to Vercel
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          supabase_origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          deployment_url="$(pnpm dlx vercel@59.19.1 deploy \
            --prod \
            --skip-domain \
            --yes \
            --archive=tgz \
            --token "$VERCEL_TOKEN" \
            --env "ONBOARDING_ORIGIN=${PRODUCTION_WEB_ORIGIN}" \
            --env "ONBOARDING_API_URL=${API_ORIGIN}" \
            --env "ONBOARDING_PUBLIC_SUPABASE_URL=${supabase_origin}" \
            --env "ONBOARDING_PUBLIC_SUPABASE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --build-env "ONBOARDING_ORIGIN=${PRODUCTION_WEB_ORIGIN}" \
            --build-env "ONBOARDING_API_URL=${API_ORIGIN}" \
            --build-env "ONBOARDING_PUBLIC_SUPABASE_URL=${supabase_origin}" \
            --build-env "ONBOARDING_PUBLIC_SUPABASE_KEY=${SUPABASE_PUBLISHABLE_KEY}")"
          [[ "$deployment_url" == https://* ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

  web:
    name: Verify and promote web
    needs: [plan, api, web-prepare]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.deploy_web == 'true' &&
          needs.web-prepare.result == 'success' &&
          ((needs.plan.outputs.deploy_api == 'true' && needs.api.result == 'success') ||
           (needs.plan.outputs.deploy_api == 'false' && needs.api.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      API_ORIGIN: ${{ needs.web-prepare.outputs.api_origin }}
      CONFIGURED_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      RELEASED_API_ORIGIN: ${{ needs.api.outputs.service_url }}
      API_REQUIRED: ${{ needs.plan.outputs.deploy_api }}
      API_RESULT: ${{ needs.api.result }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PREPARED_SHA: ${{ needs.web-prepare.outputs.sha }}
      DEPLOYMENT_URL: ${{ needs.web-prepare.outputs.url }}
      PRODUCTION_WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate prepared candidate and released API identity
        run: node scripts/deployment/web-selection.mjs promote

      - name: Verify staged web deployment
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          supabase_origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${DEPLOYMENT_URL}/" > /dev/null
          config="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${DEPLOYMENT_URL}/api/onboarding-config")"
          jq --exit-status \
            --arg url "$supabase_origin" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '.url == $url and .key == $key' <<< "$config" > /dev/null
          health="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --header "Origin: ${PRODUCTION_WEB_ORIGIN}" \
            --header 'Content-Type: application/json' \
            --data '{"query":"{ health { status } }"}' \
            "${DEPLOYMENT_URL}/api/graphql")"
          jq --exit-status '.data.health.status == "ok"' <<< "$health" > /dev/null

      - name: Promote verified web deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/vercel-promote.mjs

      - name: Verify hosted application
        shell: bash
        run: |
          set -euo pipefail
          supabase_origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 "${PRODUCTION_WEB_ORIGIN}/" > /dev/null
          config="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 "${PRODUCTION_WEB_ORIGIN}/api/onboarding-config")"
          jq --exit-status \
            --arg url "$supabase_origin" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '.url == $url and .key == $key' <<< "$config" > /dev/null
          health="$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 \
            --header "Origin: ${PRODUCTION_WEB_ORIGIN}" \
            --header 'Content-Type: application/json' \
            --data '{"query":"{ health { status } }"}' \
            "${PRODUCTION_WEB_ORIGIN}/api/graphql")"
          jq --exit-status '.data.health.status == "ok"' <<< "$health" > /dev/null

  release-status:
    name: Exact-commit API release gate
    needs: [plan, api, web-prepare, web]
    if: >-
      ${{ always() && github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish release success or explicit not-required result
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RESULT: ${{ needs.plan.result }}
          API_REQUIRED: ${{ needs.plan.outputs.deploy_api }}
          WEB_REQUIRED: ${{ needs.plan.outputs.deploy_web }}
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: node scripts/ci/release.mjs finish
