name: API

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Go source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test Cloud Run traffic selection
        run: bash scripts/cloud-run-traffic-flag-test.sh
      - name: Test deployment safety boundaries
        run: node --test scripts/deployment/*.test.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: make api-check

  migrations:
    name: Database migration and replay checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned database tools
        run: make db-tools
      - run: ./scripts/db-test.sh migrations
      - uses: actions/upload-artifact@v7
        with:
          name: database-coverage-migrations
          path: test-results/database/migrations.json
          if-no-files-found: error
          retention-days: 7

  database:
    name: Database integration (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition: [banking, expenses]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      # Cache availability affects speed only; every verification step still runs.
      - name: Cache Go modules
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.go-cache.outputs.modules }}
          key: go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/api/go.mod', 'apps/api/go.sum') }}
      # Refresh integration/race compilation after each revision. Only this job
      # writes its lane namespace; Go validates reused outputs against current inputs.
      - name: Cache database Go build outputs
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.go-cache.outputs.build }}
          key: go-database-v2-${{ matrix.partition }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/api/go.mod', 'apps/api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-database-v2-${{ matrix.partition }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/api/go.mod', 'apps/api/go.sum') }}-
            go-database-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/api/go.mod', 'apps/api/go.sum') }}-
      - name: Install pinned database tools
        run: make db-tools
      # Each matrix lane owns a complete provider/cluster and EXIT-trap cleanup.
      - run: ./scripts/db-test.sh "${{ matrix.partition }}"
      - uses: actions/upload-artifact@v7
        with:
          name: database-coverage-${{ matrix.partition }}
          path: test-results/database/${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Container and local startup checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned database tools
        run: make db-tools
      - run: docker compose config --quiet
      # Build the production image once; both startup modes use this runner's image.
      - run: docker compose build api
      - run: docker compose up --no-build --wait api
      - name: Smoke test container GraphQL
        run: |
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"query":"{ health { status } }"}' http://127.0.0.1:8080/graphql \
            | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"data":{"health":{"status":"ok"}}}'
      - run: docker compose down
      - name: Coordinated local database and API readiness
        run: make dev-up DEV_BUILD_FLAG=--no-build
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Actual restricted banking worker startup and shutdown
        env:
          BANKING_WORKER_SMOKE_DATABASE_URL: postgres://kami_worker:kami-worker-local-only@127.0.0.1:55422/postgres?sslmode=disable
        run: make banking-worker-smoke
      # Separate cleanup steps ensure Supabase stops even if Compose cleanup fails.
      - if: always()
        run: docker compose -f compose.yaml -f compose.database.yaml down
      - if: always()
        run: make db-stop

  verify:
    name: Verify API coverage
    needs: [source, migrations, database, runtime]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: database-coverage-*
          path: test-results/database
          merge-multiple: true
      - name: Require every API job and exact database coverage
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          INTEGRATION_RESULT: ${{ needs.database.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: node scripts/db-partitions.mjs aggregate
