name: Feature
description: Propose a small, testable product change
title: '[Feature]: '
labels: ['feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are we solving?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the smallest complete solution and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide observable, testable criteria.
      placeholder: '- [ ] Given ..., when ..., then ...'
    validations:
      required: true
  - type: textarea
    id: test_notes
    attributes:
      label: Test and risk notes
      description: Include edge cases, authorization, failure, duplicate, concurrency, or financial concerns.
