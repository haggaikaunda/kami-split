extend type Query {
  """
  Recover an owner-private enrollment attempt; reauthorizes the enabled actor and returns no provider tokens.
  """
  bankingEnrollment(attemptId: ID!): BankingEnrollmentResult!
  """
  Read one owner-private connection and its retained account streams. Other-owner and absent IDs have the same outcome.
  """
  bankingConnection(connectionId: ID!): BankingConnectionResult!
}
extend type Mutation {
  """
  Reserve a client-known attempt and return its encrypted, expiring Link handoff. Never persist the returned token in browser storage.
  """
  startBankingEnrollment(
    input: StartBankingEnrollmentInput!
  ): BankingEnrollmentResult!
  """
  Complete one claimed exchange with explicit selected account IDs. Read status after uncertainty; do not create another attempt blindly.
  """
  finishBankingEnrollment(
    input: FinishBankingEnrollmentInput!
  ): BankingEnrollmentResult!
  """
  Cancel activation while retaining durable, narrowly correlated cleanup intent. Cancellation does not prove provider removal.
  """
  cancelBankingEnrollment(attemptId: ID!): BankingEnrollmentResult!
}
"""
Explicit ordinary enrollment intent. Use startBankingReplacement with an owned logical account for noncontributing same-account staging.
"""
enum BankingEnrollmentIntent {
  """
  Independently authorize different accounts. Exact known duplicate evidence still rejects enrollment.
  """
  DIFFERENT
  """
  Generic existing-account intent returns replacement-required and never substitutes bindings. startBankingReplacement reserves an explicit logical target instead.
  """
  EXISTING
}
"""
Canonical owner-bound input; changed reuse of the same attempt ID conflicts.
"""
input StartBankingEnrollmentInput {
  """
  UUID generated by the caller before the first request and reused for recovery.
  """
  attemptId: ID!
  """
  Explicit different-account or existing-account intent.
  """
  intent: BankingEnrollmentIntent!
}
"""
One-use Link completion. Account selection is checked against server-observed provider accounts.
"""
input FinishBankingEnrollmentInput {
  """
  The original client-known attempt UUID.
  """
  attemptId: ID!
  """
  Short-lived public token from Link; must not be logged or persistently stored by the browser.
  """
  publicToken: String!
  """
  Explicit nonempty selected provider account IDs. Reordering is canonical; duplicates and unsupported accounts reject activation.
  """
  accountIds: [String!]!
}
"""
Safe durable enrollment result. Ready means awaiting initial import, with no assertion of transactions, freshness or spending.
"""
type BankingEnrollmentResult {
  """
  Safe actionable outcome such as PREPARED, EXCHANGING, EXCHANGE_UNKNOWN, CLEANUP_PENDING, RETRY_ALLOWED, NEEDS_ATTENTION or AWAITING_INITIAL_IMPORT.
  """
  code: String!
  """
  Persisted state, when authorized and present.
  """
  state: String
  """
  Opaque attempt identity, absent when access is denied.
  """
  attemptId: ID
  """
  Opaque connection identity after protected persistence, including non-active cleanup outcomes.
  """
  connectionId: ID
  """
  Temporary Link handoff returned only by start; never returned by status or finish.
  """
  linkToken: String
  """
  Provider-bounded handoff expiry; cleanup correlation survives this deadline.
  """
  expiresAt: String
}
"""
Owner-authorized connection read with explicit absence/error status.
"""
type BankingConnectionResult {
  """
  READY, NOT_FOUND or a safe authentication/availability outcome.
  """
  code: String!
  """
  Present only after successful current owner authorization.
  """
  connection: BankingConnection
}
"""
Private lifecycle projection. No bank credentials or financial source payloads are exposed.
"""
type BankingConnection {
  """
  Server-observed institution display name. Null for legacy/unknown metadata or deleted connections; never guessed from account names or provider identifiers.
  """
  institutionName: String
  """
  Stable private connection UUID.
  """
  id: ID!
  """
  Current active, stopped or deleted lifecycle state, distinct from import freshness.
  """
  state: String!
  """
  Retained visible account streams with explicit selection state; never-selected provider accounts are absent.
  """
  accounts: [BankingAccount!]!
}
"""
Retained private account stream; collection selection and retained history are separate.
"""
type BankingAccount {
  """
  Logical private account UUID.
  """
  id: ID!
  """
  Immutable provider stream binding UUID.
  """
  streamId: ID!
  """
  Provider display name, never evidence of duplicate identity.
  """
  name: String!
  """
  Server-verified checking, savings or credit_card kind.
  """
  kind: String!
  """
  Supported account currency, currently USD.
  """
  currency: String!
  """
  Initial requested history window of 365 days; actual coverage and retention are separate.
  """
  requestedHistoryDays: Int!
}

extend type Query {
  """
  Recover an owner-only repair attempt without returning its temporary Link token.
  """
  bankingRepair(attemptId: ID!): BankingEnrollmentResult!
  """
  Recover an owner-only management receipt after a lost response.
  """
  bankingOperation(attemptId: ID!): BankingManagementResult!
}
extend type Mutation {
  """
  Replace the explicit local subset after current server-side provider authorization; empty selection retains history.
  """
  changeBankingSelection(
    input: BankingSelectionInput!
  ): BankingManagementResult!
  """
  Prepare existing-Item update mode; no public-token exchange or replacement activation occurs.
  """
  startBankingRepair(input: BankingFenceInput!): BankingEnrollmentResult!
  """
  Finish repair with an explicit authorized subset under the original lifecycle revision.
  """
  finishBankingRepair(
    input: FinishBankingRepairInput!
  ): BankingEnrollmentResult!
  """
  Fence local collection and durably request Item teardown while retaining history. Read connection status for remote cleanup.
  """
  disconnectBanking(input: BankingFenceInput!): BankingManagementResult!
  """
  Immediately hide and fence private history, then durably purge and request teardown. No all-copy or backup erasure claim.
  """
  deleteBankingHistory(input: BankingFenceInput!): BankingManagementResult!
}
"""
Revision-checked, owner-bound lifecycle command. Changed reuse conflicts.
"""
input BankingFenceInput {
  """
  Caller-generated UUID retained across retries.
  """
  attemptId: ID!
  """
  Owner-private connection UUID.
  """
  connectionId: ID!
  """
  Last observed lifecycle generation, encoded as an exact decimal integer.
  """
  expectedGeneration: String!
}
"""
Explicit replacement of the selected subset; no newly visible account is implicitly selected.
"""
input BankingSelectionInput {
  """
  Caller-generated recovery UUID.
  """
  attemptId: ID!
  """
  Owner-private connection UUID.
  """
  connectionId: ID!
  """
  Observed lifecycle generation as an exact decimal integer.
  """
  expectedGeneration: String!
  """
  Explicit current provider account IDs; empty stops all streams without erasing data.
  """
  accountIds: [String!]!
}
"""
Explicit repair completion for one prepared existing-Item attempt.
"""
input FinishBankingRepairInput {
  """
  Original repair attempt UUID.
  """
  attemptId: ID!
  """
  Explicit current authorized provider account subset, including empty.
  """
  accountIds: [String!]!
}
"""
Safe opaque management receipt. READY is local success; provider teardown and purge are separate status fields.
"""
type BankingManagementResult {
  """
  READY, PENDING, CONFLICT, REPAIR_REQUIRED, REPLACEMENT_REQUIRED, NOT_FOUND or safe authentication/availability status.
  """
  code: String!
}
extend type BankingConnection {
  """
  Exact lifecycle revision for management compare-and-swap.
  """
  generation: String!
  """
  healthy, repair_required or accounts_available; a health hint grants no selection or consent.
  """
  health: String!
  """
  not_requested, pending, running, needs_attention or confirmed remote Item removal.
  """
  cleanup: String!
  """
  not_requested, pending or complete active-copy purge, distinct from provider retention and backups.
  """
  purge: String!
}
extend type BankingAccount {
  """
  Whether this retained stream is selected for future collection. False never erases private history.
  """
  selected: Boolean!
  """
  Owner-private provider account reference for explicit selection changes; never identity-continuity evidence.
  """
  providerAccountId: String!
}

"""
One freshly authorized page of the owner's retained connections, including stopped
connections and excluding deleted history. Failure returns no partial inventory.
"""
type BankingConnectionsResult {
  """
  READY, INVALID_INPUT or safe authentication/availability status; READY may be empty.
  """
  code: String!
  """
  Existing owner-private connection/status snapshots in ascending connection UUID order.
  """
  connections: [BankingConnection!]!
  """
  Opaque continuation position, null for an empty page; grants no authority.
  """
  endCursor: String
  """
  Whether another connection existed in this authorized snapshot. Later pages reauthorize.
  """
  hasNextPage: Boolean!
}

extend type Query {
  """
  Discover retained owner-only connections after a fresh login without provider calls.
  Every page rechecks the enabled actor; concurrent additions/deletions may change later pages.
  """
  bankingConnections(
    """
    Maximum connections per page, from 1 through 50; defaults to 20.
    """
    first: Int = 20
    """
    Opaque endCursor from an earlier page, or null to start at the beginning.
    """
    after: String
  ): BankingConnectionsResult!
}
