"""
Structured spending filters, distinct from participant-only ExpenseFilter; no free text search.
"""
input StructuredExpenseFilter {
  """
  One currently authorized eligible source Group ID; absent means All.
  """
  groupId: ID
  """
  Categories combined with OR; all different filter fields combine with AND.
  """
  categories: [Category!]
  """
  Original Membership IDs matching payer or saved split participant, including zero shares. Every ID must be authorized within the selected scope.
  """
  memberIds: [ID!]
  """
  Original Membership IDs matching only the payer, combined with OR. Every ID must be authorized within the selected scope.
  """
  paidByIds: [ID!]
  """
  Complete-result order, default DATE_DESC. Ties use created time, source UUID and expense UUID in the selected direction.
  """
  sort: ExpenseSort
  """
  Legacy single Involving Membership ID, combined with memberIds using OR. Matches payer OR saved allocation including zero share, only in its original group.
  """
  memberId: ID
  """
  Inclusive minimum effective date; valid Gregorian YYYY-MM-DD.
  """
  from: Date
  """
  Inclusive maximum effective date at or after from.
  """
  to: Date
  """
  Legacy single category, combined with categories using OR; absent selections mean all categories.
  """
  category: Category
}
"""
Complete filtered spending and a bounded source-attributed page, or safe failure with no partial values.
"""
union ExpenseViewResult = ExpenseView | Problem
"""
One complete filtered dataset anchored to per-group append-only financial revisions. Refresh without after to include new expenses; current authorization/metadata is always rechecked.
"""
type ExpenseView {
  """
  Opaque identity of this exact financial/context projection and bounded page. Includes
  scope, canonical filters, financial anchors, current context and page arguments.
  Not a Node ID, cursor or permission; every refetch rechecks current authorization.
  """
  id: ID!
  """
  Opaque equality token for the complete authorized source set and current group/member metadata, independent of filters and pagination. Compare Household reads with HouseholdDashboard.contextVersion before combining concurrent results. Never grants access or identifies a financial revision.
  """
  contextVersion: String!
  """
  Complete face-value sum at the traversal anchor; repayments excluded, independent of page size.
  """
  totalExpenseMinor: MinorUnits!
  """
  Complete viewer allocated expense amount at the same filtered anchor, excluding repayments.
  """
  viewerShareMinor: MinorUnits!
  """
  Complete expenses paid by the viewer at the same filtered anchor, excluding repayments.
  """
  viewerPaidMinor: MinorUnits!
  """
  Complete matching category aggregates, ordered by category; unmatched categories omitted, zero viewer shares retained.
  """
  categories: [ExpenseCategoryTotal!]!
  """
  Exact count of all matching expenses at the same anchor.
  """
  expenseCount: MinorUnits!
  """
  Complete matching calendar-month subtotals/counts, descending YYYY-MM; no empty month placeholders.
  """
  months: [ExpenseMonth!]!
  """
  Full-result order selected by filter.sort, default effectiveDate descending. Deterministic ties use createdAt, original group UUID and expense UUID; amount orders use effectiveDate before those ties.
  """
  edges: [ExpenseViewEdge!]!
  """
  Forward-only traversal. Cursors bind actor/scope, structured filters and sort, eligible membership/account generations and revision anchors.
  """
  pageInfo: PageInfo!
}
"""
Complete filtered subtotal for an expense effective-date month at the traversal anchor.
"""
type ExpenseMonth {
  """
  Gregorian YYYY-MM; travel dates do not restrict history.
  """
  month: String!
  """
  Complete matching face-value subtotal, never a sum of loaded rows.
  """
  totalExpenseMinor: MinorUnits!
  """
  Complete matching expense count as a canonical exact string.
  """
  expenseCount: MinorUnits!
}
"""
Original expense with currently authorized source-space metadata; no copied Household record.
"""
type ExpenseViewEdge {
  """
  Signed boundary with complete anchors; possession grants no access. Over-budget cursor returns UNAVAILABLE.
  """
  cursor: String!
  """
  Legacy anchored expense with a current Expense ID; unsafe to normalize beside current detail.
  """
  node: Expense!
    @deprecated(
      reason: "Use snapshot to isolate anchored financial values from current Expense identity."
    )
  """
  Financial values and allocations from this view anchor; member metadata is current.
  Normalize by the snapshot id, never by the original expenseId.
  """
  snapshot: ExpenseSnapshot!
  """
  Original source Group ID, current label/kind/currency/trip metadata.
  """
  source: GroupSummary!
}

"""
One category in the complete authorized filtered dataset at the traversal anchor.
"""
type ExpenseCategoryTotal {
  """
  Authoritative category shared by every expense in this aggregate.
  """
  category: Category!
  """
  Complete matching face-value amount, excluding repayments.
  """
  totalExpenseMinor: MinorUnits!
  """
  Complete stored viewer allocations, zero when absent; excludes repayments.
  """
  viewerShareMinor: MinorUnits!
  """
  Matching expense count in either basis, including expenses with zero viewer share.
  """
  expenseCount: MinorUnits!
}

"""
Full authorized result ordering; amount ties additionally use effective date.
"""
enum ExpenseSort {
  """
  Newest effective date first.
  """
  DATE_DESC
  """
  Oldest effective date first.
  """
  DATE_ASC
  """
  Largest exact face value first.
  """
  AMOUNT_DESC
  """
  Smallest exact face value first.
  """
  AMOUNT_ASC
}
