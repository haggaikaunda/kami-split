"""
Implemented immutable financial event kinds. Future mutations require explicit
production audit contracts before extending this enum.
"""
enum ActivityKind {
  """
  One committed expense creation.
  """
  EXPENSE_CREATED
  """
  One committed material expense correction, with immutable before/after values.
  """
  EXPENSE_UPDATED
  """
  One committed actual group repayment.
  """
  REPAYMENT_RECORDED
}

"""
Optional exact filters bound into every continuation cursor.
"""
input ActivityFilter {
  """
  Restrict the event kind; omitted means all supported kinds.
  """
  kind: ActivityKind
  """
  Restrict to one currently eligible source; excluded IDs are masked.
  """
  sourceGroupId: ID
}

"""
Minimal current authorized label for an immutable historical membership.
"""
type ActivityIdentity {
  """
  Stable same-source Membership ID, never a peer account identifier.
  """
  id: ID!
  """
  Current authorized display label, which may represent a historical member.
  """
  displayName: String!
}

"""
One immutable event, ordered by event time, kind and stable record UUID.
"""
type ActivityEvent {
  """
  Stable event identity independent of pagination and filters.
  """
  id: ID!
  """
  Current authorized Expense or Repayment ID; detail must reauthorize.
  """
  recordId: ID!
  """
  The supported committed mutation.
  """
  kind: ActivityKind!
  """
  Original source Group ID; financial boundaries remain independent.
  """
  groupId: ID!
  """
  Current authorized source label.
  """
  groupName: String!
  """
  Current authorized source kind for canonical Group or Trip navigation. This
  metadata is read with the event page; it does not change original financial IDs.
  Household sources remain ORDINARY and are identified separately by isHousehold.
  """
  groupKind: GroupKind!
  """
  Whether the source is the designated Household ledger.
  """
  isHousehold: Boolean!
  """
  Exact expense face value or actual repayment amount.
  """
  amountMinor: MinorUnits!
  """
  Original record currency.
  """
  currency: Currency!
  """
  Financial effective date, distinct from event order.
  """
  effectiveDate: Date!
  """
  Immutable recorded commit timestamp in UTC microseconds.
  """
  timestamp: DateTime!
  """
  Membership that committed this mutation.
  """
  creator: ActivityIdentity!
  """
  Expense payer; null for a repayment.
  """
  payer: ActivityIdentity
  """
  Repayment sender; null for an expense.
  """
  sender: ActivityIdentity
  """
  Repayment recipient; null for an expense.
  """
  recipient: ActivityIdentity
}

"""
A scope-bound position and its immutable event.
"""
type ActivityEdge {
  """
  Authenticated forward traversal boundary.
  """
  cursor: String!
  """
  One freshly authorized event.
  """
  node: ActivityEvent!
}

"""
Complete bounded event traversal, independent of financial record page sizes.
"""
type ActivityConnection {
  """
  Events from the fixed source revisions in deterministic descending order.
  """
  edges: [ActivityEdge!]!
  """
  Continuation metadata; refresh restarts with current authorization.
  """
  pageInfo: PageInfo!
}

"""
Safe failure or a complete authorized activity page.
"""
union ActivityResult = ActivityConnection | Problem

extend type ActivityEvent {
  """
  Description recorded by this event; later edits do not rewrite it. Empty for repayment events.
  """
  description: String!
  """
  Original optional expense or repayment note, preserving whitespace.
  """
  note: String!
  """
  Immutable previous expense state for an update; null for creation and repayment.
  """
  before: ActivityExpenseSnapshot
  """
  Immutable expense state committed by creation or update; null for repayment.
  """
  after: ActivityExpenseSnapshot
}

"""
Immutable descriptive and financial values with current authorized minimal member labels.
"""
type ActivityExpenseSnapshot {
  """
  Recorded description, independent of later edits.
  """
  description: String!
  """
  Exact expense face value in cents.
  """
  totalMinor: MinorUnits!
  """
  Recorded expense date, distinct from the event timestamp.
  """
  effectiveDate: Date!
  """
  Recorded supported category.
  """
  category: Category!
  """
  Original optional note, preserving whitespace.
  """
  note: String!
  """
  Recorded payer identity with a currently authorized label.
  """
  payer: ActivityIdentity!
  """
  Recorded split intent; equal resolved cents do not erase its mode.
  """
  split: SplitMode!
  """
  Every recorded participant, including explicit zero allocations.
  """
  allocations: [ActivityAllocation!]!
}

"""
One historical explicit participant share and saved percentage intent.
"""
type ActivityAllocation {
  """
  Retained participant with current authorized minimal label.
  """
  participant: ActivityIdentity!
  """
  Exact recorded share in cents; zero remains explicit participation.
  """
  amountMinor: MinorUnits!
  """
  Intended hundredths of a percent for PERCENTAGE; null otherwise.
  """
  percentageHundredths: Int
}

"""
One freshly authorized historical event or a safe masked failure.
"""
union ActivityEventResult = ActivityEvent | Problem

extend type Query {
  """
  Read immutable event facts after rechecking the entire requested source context.
  """
  activityEvent(
    """
    Stable event ID obtained from an authorized Activity feed.
    """
    eventId: ID!
    """
    Original group scope; omission requests currently authorized Household aggregate scope.
    """
    groupId: ID
  ): ActivityEventResult!
}
