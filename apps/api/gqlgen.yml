schema:
  - ../../packages/schema/*.graphql
exec:
  filename: internal/graph/generated.go
  package: graph
model:
  filename: internal/graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph
  filename_template: '{name}.resolvers.go'
models:
  ReportingTimezoneVersion:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/reportingtimezone.Version
  MinorUnits:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/ledger.MinorUnits
  Revision:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/ledger.Revision
  Date:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/ledger.Date
  DateTime:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/ledger.DateTime
  OperationKey:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/ledger.OperationKey
  Group:
    fields:
      expenses:
        resolver: true
      repayments:
        resolver: true
    extraFields:
      Snapshot:
        type: github.com/haggaikaunda/kami-split/apps/api/internal/expense.Snapshot
      PageError:
        type: string
      RepaymentError:
        type: string
      PageRequest:
        type: github.com/haggaikaunda/kami-split/apps/api/internal/expense.PageRequest
      Filter:
        type: github.com/haggaikaunda/kami-split/apps/api/internal/ledger.Filter
  BankingArchiveReference:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.ArchiveReference
  BankingTransaction:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.Transaction
  BankingReportInterval:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.ReportInterval
  BankingReportAccount:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.ReportAccount
  BankingReportActivity:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.ReportActivity
  BankingReportSummary:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.ReportSummary
  BankingReport:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.Report
  BankingTransactionDetail:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.TransactionDetail

  BankingReportArchive:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.ReportArchive

  BankingReportCounts:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.ReportCounts

  BankingAnnotationSnapshot:
    model: github.com/haggaikaunda/kami-split/apps/api/internal/banking.AnnotationSnapshot
