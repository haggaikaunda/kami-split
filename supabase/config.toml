# Local-only Supabase stack. CLI owns PostgreSQL/Auth; Compose owns Go.
project_id = "kami-split"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
# Reviewed manual migrations; see docs/application/database-development.md.
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seeds/local.sql"]

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[studio]
enabled = false

[local_smtp]
enabled = true
port = 55424

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
