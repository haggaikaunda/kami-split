version: '2'
sql:
  # Disposable generation probe remains separate from production objects.
  - engine: postgresql
    schema: apps/api/internal/database/sqlctest/schema.sql
    queries: apps/api/internal/database/sqlctest/query.sql
    gen:
      go:
        package: sqlctest
        out: apps/api/internal/database/sqlctest
        sql_package: pgx/v5
  - engine: postgresql
    schema: supabase/schemas
    queries: apps/api/internal/database/identityquery/query.sql
    gen:
      go:
        omit_unused_structs: true
        package: identityquery
        out: apps/api/internal/database/identityquery
        sql_package: pgx/v5
  - engine: postgresql
    schema: supabase/schemas
    queries: apps/api/internal/database/expensequery/query.sql
    gen:
      go:
        omit_unused_structs: true
        package: expensequery
        out: apps/api/internal/database/expensequery
        sql_package: pgx/v5
  - engine: postgresql
    schema: supabase/schemas
    queries: apps/api/internal/database/bankingquery/query.sql
    gen:
      go:
        omit_unused_structs: true
        package: bankingquery
        out: apps/api/internal/database/bankingquery
        sql_package: pgx/v5
